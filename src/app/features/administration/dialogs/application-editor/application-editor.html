<form [formGroup]="applicationForm" (ngSubmit)="save()">
  <div class="grid sm:grid-cols-1 lg:grid-cols-2 gap-x-2 gap-y-6 pt-1">
    <div class="sm:col-span-2">
      <p-floatlabel variant="on">
        <input id="name" [fluid]="true" pInputText autocomplete="off" formControlName="name" />
        <label for="name">Nombre</label>
      </p-floatlabel>
    </div>
    <div class="sm:col-span-2">
      <p-floatlabel variant="on">
        <input
          id="description"
          [fluid]="true"
          pInputText
          autocomplete="off"
          formControlName="description"
        />
        <label for="description">Descripcion</label>
      </p-floatlabel>
    </div>
    <div>
      <p-floatlabel variant="on">
        <input id="code" [fluid]="true" pInputText autocomplete="off" formControlName="clientId" />
        <label for="code">Identificador unico</label>
      </p-floatlabel>
      <!-- @if (formUtils.isValidField(applicationForm, 'clientId')) {
      <p-message severity="error" size="small" variant="simple">
        {{ formUtils.getErrorMessage(applicationForm, 'clientId') }}
      </p-message>
      } -->
    </div>
    <div>
      <p-floatlabel variant="on">
        <input
          id="launchUrl"
          [fluid]="true"
          pInputText
          autocomplete="off"
          formControlName="launchUrl"
        />
        <label for="launchUrl">URL de inicio</label>
      </p-floatlabel>
    </div>
    <div>
      <p-floatlabel variant="on">
        <input
          id="clientProfile"
          [fluid]="true"
          pInputText
          autocomplete="off"
          formControlName="clientProfile"
        />
        <label for="clientProfile">Nombre del rol por defecto</label>
      </p-floatlabel>
    </div>
    <div class="flex items-center gap-x-2 px-4">
      <span>Color:</span>
      <p-colorpicker formControlName="color" appendTo="body" />
    </div>
    <div class="sm:col-span-2">
      <p-floatlabel variant="on">
        <p-autocomplete
          inputId="redirect_uris"
          formControlName="redirectUris"
          multiple
          fluid
          [typeahead]="false"
          [addOnBlur]="true"
        />
        <label for="redirect_uris">URLs de redireccion (SSO)</label>
      </p-floatlabel>
    </div>
  </div>
  <div class="p-dialog-footer">
    <p-button label="Cancelar" type="button" severity="secondary" (onClick)="close()" />
    <p-button label="Guardar" type="submit" [disabled]="applicationForm.invalid" />
  </div>
</form>
