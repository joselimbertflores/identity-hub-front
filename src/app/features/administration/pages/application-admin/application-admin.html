<div class="flex items-center justify-between mb-4">
  <h2 class="text-2xl font-semibold">Sistemas</h2>
  <p-button
    label="Agregar"
    icon="pi pi-plus"
    iconPos="left"
    size="small"
    (onClick)="openApplicationDialog()"
  />
</div>
<div>
  <p-table
    #table
    [value]="dataSource()"
    [totalRecords]="dataSize()"
    [rows]="limit()"
    [paginator]="true"
    (onPage)="changePage($event)"
    size="small"
  >
    <ng-template #caption>
      <div class="flex sm:justify-end">
        <div class="w-full sm:w-1/4">
          <search-input (search)="search($event)" label="Buscar" />
        </div>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th class="w-[150px]">Estado</th>
        <th style="width: 2.5rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.description }}</td>
        <td>
          @if (item.isActive) {
            <p-tag severity="success" value="Habilitado" />
          } @else {
            <p-tag severity="warn" value="Deshabilitado" />
          }
        </td>
        <td>
          <p-button
            severity="secondary"
            [rounded]="true"
            icon="pi pi-ellipsis-v"
            size="small"
            (click)="openMenu(item); menu.toggle($event)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
  <p-menu #menu [popup]="true" appendTo="body" [model]="menuItems"></p-menu>
</div>
<p-confirmdialog />
