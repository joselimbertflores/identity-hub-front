<main class="min-h-screen bg-muted/30 px-4 py-10 sm:px-6 lg:px-8">
  <div class="mx-auto w-full max-w-xl">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-foreground">
        Actualice su contraseña
      </h1>
      <p class="mt-2 text-sm leading-6 text-muted-foreground">
        Por seguridad, debe actualizar su contraseña para continuar usando el sistema.
      </p>
    </div>
    <section class="rounded-xl border border-border bg-card p-5 shadow-sm sm:p-6">
      <app-password-change-form
        submitLabel="Guardar y continuar"
        [loading]="isLoading()"
        [errorMessage]="errorMessage()"
        (submitted)="submit($event)"
      />
    </section>
  </div>
</main>
