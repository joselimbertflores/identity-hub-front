<div class="flex h-screen overflow-hidden bg-muted/30">
  @if (!isMobile()) {
    <aside class="w-64 shrink-0 border-r border-border bg-sidebar text-sidebar-foreground">
      <app-sidebar [user]="user()" />
    </aside>
  }
  <div class="flex-1 flex flex-col min-w-0">
    <header class="flex h-14 items-center gap-3 border-b border-border bg-background px-4">
      @if (isMobile()) {
        <button hlmBtn variant="ghost" size="icon" type="button" aria-label="Abrir menú" (click)="openMobileMenu()">
          <ng-icon name="lucideMenu" />
        </button>
      }
      <div class="flex-1"></div>
      <profile-overlay />
    </header>

    <main class="flex-1 overflow-auto p-2 sm:p-4">
      <router-outlet />
    </main>
  </div>
</div>

<hlm-sheet side="left" [state]="mobileMenuOpen() ? 'open' : 'closed'" (closed)="closeMobileMenu()">
  <hlm-sheet-content *hlmSheetPortal class="w-64 p-0">
    <hlm-sheet-header class="sr-only">
      <h2 hlmSheetTitle>Menú</h2>
      <p hlmSheetDescription>Navegación principal</p>
    </hlm-sheet-header>
    <app-sidebar [user]="user()" />
  </hlm-sheet-content>
</hlm-sheet>
